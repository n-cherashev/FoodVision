services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foodvision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - foodvision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodvision"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__FoodVision: Host=postgres;Port=5432;Database=foodvision;Username=postgres;Password=postgres
      Cors__Origins__0: http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      VIDEO_PATH: /app/videos/Cctv-Resturant-Demo.mp4
      MODEL_PATH: /app/models/yolo11x-pose.pt
      TABLE_MODEL_PATH: /app/models/yolo11x.onnx
      IMGSZ: "960"
      CONF: "0.25"
      COUNT_INCREASE_DELAY: "1.0"
      SHOW_DASHBOARD: "true"
      DASHBOARD_WIDTH: "240"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/foodvision
    volumes:
      - ./models:/app/models:ro
      - ./videos:/app/videos
      - ./analytics/config:/app/config:ro
      - foodvision_analytics_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    gpus: all
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
      - analytics
    restart: unless-stopped

volumes:
  foodvision_analytics_data:
  foodvision_postgres_data:
