services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Analysis__RfdetrKeypointModelPath: /app/models/rfdetr-keypoint-preview.onnx
      Analysis__RfdetrKeypointConfidence: "0.40"
      Analysis__TableDetectionModelPath: /app/models/yolo11x.onnx
      Analysis__FfmpegPath: ffmpeg
      Analysis__FfprobePath: ffprobe
      # Measured stable limit on the current RTX 5070 Ti; higher values saturated VRAM.
      Analysis__BenchmarkGpuConcurrency: 10
      Cors__Origins__0: http://localhost:8081
    volumes:
      - ./models:/app/models:ro
      - ./videos:/app/videos:ro
    gpus: all
    restart: unless-stopped

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      VIDEO_PATH: /app/videos/Cctv-Resturant-Demo.mp4
      MODEL_PATH: /app/models/yolo11x-pose.pt
      IMGSZ: "960"
      CONF: "0.25"
      COUNT_INCREASE_DELAY: "1.0"
      SHOW_DASHBOARD: "true"
      DASHBOARD_WIDTH: "240"
    volumes:
      - ./models:/app/models:ro
      - ./videos:/app/videos:ro
      - ./analytics/config:/app/config:ro
      - foodvision_analytics_data:/app/data
    gpus: all
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
      - analytics
    restart: unless-stopped

volumes:
  foodvision_analytics_data:
