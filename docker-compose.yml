services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Analysis__PersonPoseModelPath: /app/models/yolo11x-pose.onnx
      Analysis__PersonDetectionModelPath: /app/models/yolo26l-detect.onnx
      Analysis__TableDetectionModelPath: /app/models/yolo11x.onnx
      Analysis__FfmpegPath: ffmpeg
      Analysis__FfprobePath: ffprobe
      # Measured stable limit on the current RTX 5070 Ti; higher values saturated VRAM.
      Analysis__BenchmarkGpuConcurrency: 10
      Cors__Origins__0: http://localhost:8081
    volumes:
      - ./models:/app/models:ro
      - ./videos:/app/videos:ro
    gpus: all
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
