services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in docker/.env.postgres}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in docker/.env.postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env.postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - foodvision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    environment:
      ConnectionStrings__FoodVision: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in docker/.env.postgres};Username=${POSTGRES_USER:?Set POSTGRES_USER in docker/.env.postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env.postgres}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  foodvision_postgres_data:
